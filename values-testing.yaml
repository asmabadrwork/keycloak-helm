# Testing Keycloak Helm Values (OpsTree Architecture + ESO Integration Option)
# Usage: helm upgrade --install keycloak ./chart -n keycloak -f values-testing.yaml

# Top-level Domain & TLS Configuration (OpsTree standard)
domain: keycloak.tyagi.fun

tls:
  enabled: true
  secretName: keycloak-tls-secret

# Single/Multi replica testing environment
replicaCount: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: 26.3.3
  pullPolicy: IfNotPresent

# Admin Credentials (Zero Hardcoded Secrets)
admin:
  createSecret: true
  existingSecret: ""
  username: admin
  password: "" # Dynamically set at deploy time or via secret

# Keycloak Quarkus Configuration
hostname: "keycloak.tyagi.fun"
hostnameStrict: false
proxyHeaders: "xforwarded"
httpEnabled: true
metricsEnabled: true
healthEnabled: true
logLevel: "INFO"

# Database Configuration (Zero Hardcoded Secrets)
database:
  vendor: postgres
  host: "postgres-ha.keycloak.svc.cluster.local"
  port: 5432
  name: "keycloak"
  username: "keycloak"
  createSecret: true
  existingSecret: ""
  password: "" # Dynamically set at deploy time or via secret

# Cache settings (Disabled for single-pod testing)
cache:
  enabled: false

# Resource allocations suitable for Minikube / EC2
resources:
  limits:
    cpu: 1000m
    memory: 1536Mi
  requests:
    cpu: 500m
    memory: 768Mi

# Keycloak Service Configuration (OpsTree pattern)
keycloak:
  service:
    type: NodePort
    port: 80
    nodePort: 30080

# Probes tuned for lower resource dev/test environments
livenessProbe:
  initialDelaySeconds: 150
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 10

# Service Account
serviceAccount:
  create: true
  name: ""

# Horizontal Pod Autoscaler Enabled for Testing (Auto-scales 1 to 3 pods)
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget Enabled for Testing
pdb:
  enabled: true
  minAvailable: 1

# NetworkPolicy Internal Pod Firewall Enabled for Testing
networkPolicy:
  enabled: true

# Pod Anti-Affinity for Testing
podAntiAffinity:
  enabled: false
  type: soft
