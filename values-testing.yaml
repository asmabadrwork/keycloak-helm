# Testing Keycloak Helm Values (Optimized for Minikube / EC2 Single Node)
# Usage: helm upgrade --install keycloak ./chart -n keycloak -f values-testing.yaml

# Single replica for testing environment
replicaCount: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: 26.3.3
  pullPolicy: IfNotPresent

# Admin Credentials
admin:
  createSecret: true
  existingSecret: ""
  username: admin
  password: "ChangeMeProductionPassword123!"

# Keycloak Quarkus Configuration for Minikube Testing
hostname: "keycloak.local"
hostnameStrict: false
hostnameStrictHttps: false
proxyHeaders: "xforwarded"
httpEnabled: true
metricsEnabled: true
healthEnabled: true
logLevel: "INFO"

# Database Configuration (Connects to the test PostgreSQL deployed in keycloak namespace)
database:
  vendor: postgres
  host: "postgres-ha.keycloak.svc.cluster.local"
  port: 5432
  name: "keycloak"
  username: "keycloak"
  createSecret: true
  existingSecret: ""
  password: "ChangeMeProductionDbPassword123!"

# Cache settings (Disabled for single-pod testing)
cache:
  enabled: false

# Lower resource allocations suitable for Minikube / EC2 t3.medium
resources:
  limits:
    cpu: 1000m
    memory: 1536Mi
  requests:
    cpu: 500m
    memory: 768Mi

# Probes tuned for lower resource dev/test environments
livenessProbe:
  initialDelaySeconds: 150
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 10

# Ingress Configuration (for Minikube testing)
ingress:
  enabled: false # Set to true if minikube ingress addon is enabled
  className: "nginx"
  hostname: "keycloak.local"
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
  tls:
    enabled: false
    secretName: keycloak-tls-secret

# Service Account
serviceAccount:
  create: true
  name: ""

# Disable pod anti-affinity for single-node Minikube cluster
podAntiAffinity:
  enabled: false
  type: soft
