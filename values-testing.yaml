# Testing Keycloak Helm Values (OpsTree Backstage-style Network Architecture)
# Usage: helm upgrade --install keycloak ./chart -n keycloak -f values-testing.yaml

# Top-level Domain & TLS Configuration (OpsTree standard)
domain: keycloak.tyagi.fun

tls:
  enabled: true
  secretName: keycloak-tls-secret

# Single replica for testing environment
replicaCount: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: 26.3.3
  pullPolicy: IfNotPresent

# Admin Credentials
admin:
  createSecret: true
  existingSecret: ""
  username: admin
  password: "ChangeMeProductionPassword123!"

# Keycloak Quarkus Configuration
hostname: "keycloak.tyagi.fun"
hostnameStrict: false
proxyHeaders: "xforwarded"
httpEnabled: true
metricsEnabled: true
healthEnabled: true
logLevel: "INFO"

# Database Configuration
database:
  vendor: postgres
  host: "postgres-ha.keycloak.svc.cluster.local"
  port: 5432
  name: "keycloak"
  username: "keycloak"
  createSecret: true
  existingSecret: ""
  password: "ChangeMeProductionDbPassword123!"

# Cache settings (Disabled for single-pod testing)
cache:
  enabled: false

# Lower resource allocations suitable for Minikube / EC2
resources:
  limits:
    cpu: 1000m
    memory: 1536Mi
  requests:
    cpu: 500m
    memory: 768Mi

# Keycloak Service Configuration (OpsTree pattern)
keycloak:
  service:
    type: NodePort
    port: 80
    nodePort: 30080

# Probes tuned for lower resource dev/test environments
livenessProbe:
  initialDelaySeconds: 150
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 10

# Service Account
serviceAccount:
  create: true
  name: ""

# HPA & PDB (Disabled for single-pod testing)
hpa:
  enabled: false

pdb:
  enabled: false

# Disable pod anti-affinity for single-node Minikube cluster
podAntiAffinity:
  enabled: false
  type: soft
