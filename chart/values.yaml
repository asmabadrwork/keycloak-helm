# Production Keycloak Helm Values (OpsTree Backstage-style Network Architecture)

# Top-level Domain & TLS Configuration (OpsTree standard)
domain: keycloak.opstree.dev

tls:
  enabled: true
  secretName: keycloak-tls-secret

replicaCount: 2

image:
  repository: quay.io/keycloak/keycloak
  tag: 26.3.3
  pullPolicy: IfNotPresent

# Admin Credentials
admin:
  createSecret: true
  existingSecret: ""
  username: admin
  password: "ChangeMeProductionPassword123!"

# Keycloak Quarkus Runtime Configuration
hostname: "keycloak.opstree.dev"
hostnameStrict: true
proxyHeaders: "xforwarded"
httpEnabled: true
metricsEnabled: true
healthEnabled: true
logLevel: "INFO"

# Database Configuration (External HA PostgreSQL / Amazon RDS)
database:
  vendor: postgres
  host: "postgres-ha.database.svc.cluster.local"
  port: 5432
  name: "keycloak"
  username: "keycloak"
  createSecret: true
  existingSecret: ""
  password: "ChangeMeProductionDbPassword123!"

# Clustering & Cache (Infinispan via JGroups KUBE_PING)
cache:
  enabled: true
  stack: kubernetes

# Resource Allocations
resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    cpu: 1000m
    memory: 1024Mi

# Keycloak Service Configuration (OpsTree pattern)
keycloak:
  service:
    type: ClusterIP
    port: 80

# Probes
livenessProbe:
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Service Account
serviceAccount:
  create: true
  name: ""

# High Availability Pod Anti-Affinity
podAntiAffinity:
  enabled: true
  type: hard
