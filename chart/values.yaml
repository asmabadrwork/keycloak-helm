# Default values for custom Keycloak Helm Chart (Zero Hardcoded Secrets)

# Top-level Domain & TLS Configuration (OpsTree standard)
domain: keycloak.opstree.dev

tls:
  enabled: true
  secretName: keycloak-tls-secret

replicaCount: 2

image:
  repository: quay.io/keycloak/keycloak
  tag: 26.3.3
  pullPolicy: IfNotPresent

# Admin Credentials (Managed dynamically via Secrets Engine)
admin:
  createSecret: false
  existingSecret: "keycloak-admin-secret"
  username: admin
  password: ""

# Keycloak Quarkus Runtime Configuration
hostname: "keycloak.opstree.dev"
hostnameStrict: true
proxyHeaders: "xforwarded"
httpEnabled: true
metricsEnabled: true
healthEnabled: true
logLevel: "INFO"

# Database Configuration (Managed dynamically via Secrets Engine)
database:
  vendor: postgres
  host: "postgres-ha.database.svc.cluster.local"
  port: 5432
  name: "keycloak"
  username: "keycloak"
  createSecret: false
  existingSecret: "keycloak-db-secret"
  password: ""

# External Secrets Operator (ESO) - AWS Secrets Manager Integration
externalSecrets:
  enabled: false
  awsRegion: "us-east-1"
  awsSecretName: "production/keycloak/credentials"

# NetworkPolicy Firewall
networkPolicy:
  enabled: false

# Clustering & Cache (Infinispan via JGroups KUBE_PING)
cache:
  enabled: true
  stack: kubernetes

# Resource Allocations
resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    cpu: 1000m
    memory: 1024Mi

# Keycloak Service Configuration (OpsTree pattern)
keycloak:
  service:
    type: ClusterIP
    port: 80

# Probes
livenessProbe:
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Service Account
serviceAccount:
  create: true
  name: ""

# HPA & PDB Configuration
hpa:
  enabled: false

pdb:
  enabled: false

# High Availability Pod Anti-Affinity
podAntiAffinity:
  enabled: true
  type: hard
