# Enterprise Production Keycloak Helm Values (OpsTree Standard)
# Usage: helm upgrade --install keycloak ./chart -n keycloak -f values-production.yaml

# Top-level Domain & TLS Configuration
domain: keycloak.opstree.dev

tls:
  enabled: true
  secretName: keycloak-tls-secret

# Multi-pod High Availability Replication
replicaCount: 2

image:
  repository: quay.io/keycloak/keycloak
  tag: 26.3.3
  pullPolicy: IfNotPresent

# Admin Credentials
admin:
  createSecret: true
  existingSecret: ""
  username: admin
  password: "CHANGE_ME_PRODUCTION_ADMIN_PASSWORD"

# Keycloak Quarkus Runtime Configuration
hostname: "keycloak.opstree.dev"
hostnameStrict: true
proxyHeaders: "xforwarded"
httpEnabled: true
metricsEnabled: true
healthEnabled: true
logLevel: "INFO"

# External Database Configuration (Amazon RDS / HA PostgreSQL)
database:
  vendor: postgres
  host: "keycloak-db.c123456789.us-east-1.rds.amazonaws.com"
  port: 5432
  name: "keycloak"
  username: "keycloak"
  createSecret: true
  existingSecret: ""
  password: "CHANGE_ME_PRODUCTION_DB_PASSWORD"

# Infinispan User Session Clustering for Multi-Pod HA
cache:
  enabled: true
  stack: kubernetes

# Production Resource Allocations
resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    cpu: 1000m
    memory: 1024Mi

# Production Health Probes
livenessProbe:
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Keycloak Service Configuration (ClusterIP for Production Ingress)
keycloak:
  service:
    type: ClusterIP
    port: 80

# Horizontal Pod Autoscaler (Auto-scales from 2 to 5 pods under heavy load)
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget (Guarantees zero downtime during node maintenance)
pdb:
  enabled: true
  minAvailable: 1

# Service Account & Security
serviceAccount:
  create: true
  name: keycloak-service-account

# High Availability Pod Anti-Affinity (Spreads pods across different nodes/AZs)
podAntiAffinity:
  enabled: true
  type: hard
